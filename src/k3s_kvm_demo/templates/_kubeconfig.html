{% if download %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kubeconfig export</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/notifications.js" defer></script>
</head>
<body><main class="page">
{% endif %}
{% if error %}
<div class="flash flash-error" role="alert" data-notification>
  <span class="flash-text">{{ error }}</span>
  <button type="button" class="flash-dismiss" data-dismiss-notification
          aria-label="Dismiss notification">&times;</button>
</div>
{% else %}
<section class="card kubeconfig">
  <label for="kubeconfig-text">Kubeconfig (demo cluster administrator access)</label>
  <textarea id="kubeconfig-text" readonly rows="10" spellcheck="false">{{ kubeconfig }}</textarea>
  <div class="actions">
    <button class="btn btn-primary" type="button" hx-on:click="
      const text = document.getElementById('kubeconfig-text');
      const status = document.getElementById('kubeconfig-status');
      text.select();
      if (!navigator.clipboard) {
        status.textContent = 'Clipboard unavailable. Copy the selected text or use Download kubeconfig.';
      } else {
        navigator.clipboard.writeText(text.value).then(
          () => status.textContent = 'Copied to clipboard.',
          () => status.textContent = 'Clipboard denied. Copy the selected text or use Download kubeconfig.'
        );
      }
    ">Copy to clipboard</button>
  </div>
  <p id="kubeconfig-status" class="progress" role="status"></p>
</section>
{% endif %}
{% if download %}
<a href="/">Back to dashboard</a>
</main></body></html>
{% endif %}

# k3s-kvm-demo configuration.
#
# Copy to config.toml and edit. Validate with:  uv run k3s-demo check

[server]
# Must be a loopback address. This API destroys VMs and runs root commands
# inside guests with no authentication; listening off-host is refused, not
# merely warned about.
bind = "127.0.0.1"
port = 8000
# Host headers the dashboard will accept mutating requests from. Loopback
# binding alone does not stop a page on another origin POSTing here.
allowed_hosts = ["127.0.0.1:8000", "localhost:8000"]
# Must be absolute. Use the same path for service and manual launches, regardless
# of the working directory or XDG_RUNTIME_DIR. The parent directory must
# already exist and be writable by the dashboard account. init-pool does not
# create it; use the service RuntimeDirectory or the manual setup in Readme.md.
lock_path = "/run/k3s-kvm-demo/dashboard.lock"

[libvirt]
uri = "qemu:///system"
# A pool used by nothing else. Create it with:  uv run k3s-demo init-pool
# Startup refuses to run unless the pool contains the marker volume that
# command writes, and refuses again if it finds a volume it cannot account
# for: the app deletes seed disks and overlays in here.
pool = "k3s-demo"
network = "default"

[vm]
# Build a new v2 image with firstboot/k3s-demo-guest and both repository-owned
# units installed; enable k3s-node.service and qemu-guest-agent.service.
# Disable/mask packaged k3s units and clear cluster data. Leave /etc/machine-id
# empty so PID 1 generates an ID without interactive first-boot setup or presets.
# Remove /var/lib/dbus/machine-id and /var/lib/systemd/random-seed.
# See Readme.md for the full contract and scripts/build-image.sh for the recipe.
# The base must be standalone qcow2, with no backing file of its own.
# Keep it OUTSIDE the demo pool. Never overwrite an existing backing image.
# The builder defaults to this v2 path, refuses overwrite, and publishes atomically.
# Prefer an absolute path. Relative paths resolve from the process's working
# directory, not from this configuration file's directory.
base_image = "/var/lib/libvirt/images/k3s-base-v2.qcow2"
# Overlay capacity. Must be at least the base image's virtual size.
disk_gb = 24
memory_mb = 4096
vcpus = 4
# Node names are "<name_prefix>-<32 hex>"; the hex is the domain UUID.
name_prefix = "k3s-node"
# A hard ceiling so a visitor cannot exhaust the booth machine.
max_nodes = 8

[cluster]
# Pre-shared join secret, used by every node. Change it.
token = "booth-demo-please-change-me"
# Extra Subject Alternative Names for the control plane certificate, e.g. a
# fixed VIP you want kubectl to reach the cluster through.
tls_san = []

[observation]
# Poll guest-owned preparation and current systemd service state.
interval_s = 2
# Per QEMU guest-agent call; provisioning itself runs inside the guest.
qga_timeout_s = 2
# Older evidence becomes unknown and cannot authorize a new cluster join.
# All observation values must be positive integers; stale_after_s > interval_s.
stale_after_s = 30

[maintenance]
# How long shutdown waits for in-flight guest-agent calls before giving up and
# exiting anyway. The libvirt connection is left open if a worker is still in
# it, rather than closing a connection still in use.
shutdown_grace_s = 30

# k3s-kvm-demo configuration.
#
# Copy to config.toml and edit. Validate with:  uv run k3s-demo check

[server]
# Loopback only: the unauthenticated API controls VMs and runs guest root commands.
bind = "127.0.0.1"
port = 8000
# Accepted hosts for mutating requests; cross-origin requests are rejected.
allowed_hosts = ["127.0.0.1:8000", "localhost:8000"]

[libvirt]
uri = "qemu:///system"
# Dedicated pool. init-pool creates its ownership marker.
# Startup rejects missing ownership or unrecognized volumes.
pool = "k3s-demo"
network = "default"

[vm]
# The deployment script extracts the bundled image here. For custom paths,
# see docs/operations.md; for image builds, see image/Readme.md.
# Standalone qcow2, outside the demo pool. Never overwrite a backing image.
# Use an absolute path matching both sides of the Quadlet's Volume= line.
base_image = "/var/lib/libvirt/images/k3s-base-v2.qcow2"
# Overlay capacity. Must be at least the base image's virtual size.
disk_gb = 24
memory_mb = 4096
vcpus = 4
# Node names are "<name_prefix>-<32 hex>"; the hex is the domain UUID.
name_prefix = "k3s-node"
# A hard ceiling so a visitor cannot exhaust the booth machine.
max_nodes = 8
# Start retained, stopped nodes once when the dashboard launches.
autostart_on_launch = true

[cluster]
# Pre-shared join secret, used by every node. Change it.
token = "booth-demo-please-change-me"
# Extra certificate Subject Alternative Names, such as a fixed virtual IP.
tls_san = []

[observation]
# Poll guest-owned preparation and current systemd service state.
interval_s = 2
# Per QEMU guest-agent call; provisioning itself runs inside the guest.
qga_timeout_s = 2
# Older evidence becomes unknown and cannot authorize a new cluster join.
# All observation values must be positive integers; stale_after_s > interval_s.
stale_after_s = 30

[kubeconfig_export]
# Continuously replaced while the dashboard runs; removed on failure or shutdown.
# Use a dedicated absolute path in an existing writable directory.
# The example container already shares this directory with the host.
path = "/run/k3s-kvm-demo/kubeconfig.yaml"
interval_s = 1

[maintenance]
# Shutdown wait for guest-agent calls. Connections still in use remain open.
shutdown_grace_s = 30
